<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Rummikub Score</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">Rummikub Score</a>
  </header>
  <main id="app"></main>

  <button id="timer-fab" class="fab" aria-label="Open timer">⏱</button>
  <dialog id="timer-dialog" class="timer">
    <div class="timer-display" id="timer-display">60</div>
    <div class="timer-controls">
      <button id="timer-start" class="btn primary">Start</button>
      <button id="timer-reset" class="btn">Reset</button>
    </div>
    <label class="timer-duration">
      Duration: <output id="timer-duration-out">60</output>s
      <input type="range" id="timer-duration" min="30" max="120" step="5" value="60">
    </label>
    <button id="timer-close" class="btn link">Close</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
